<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Acro Party</title>
<style>
  /* Kept simple on purpose: older LG TVs (webOS 5+, Chromium 68+) must run this page. */
  html, body { margin: 0; height: 100%; background: #06051a; color: #f4f1ff; font-family: "LG Smart UI", "Segoe UI", Arial, sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at 30% 20%, #3a1c7a 0%, #140f3a 45%, #06051a 100%); }
  .wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .panel { width: 1180px; text-align: center; }
  h1 { font-size: 110px; margin: 0 0 6px; letter-spacing: 1px; }
  h1 span { color: #ffd23f; }
  .sub { font-size: 34px; color: #b9b2e6; margin: 0 0 46px; }
  .row { display: flex; justify-content: center; margin: 0 0 26px; }
  .row > * { margin: 0 12px; }
  button { font: inherit; font-size: 36px; font-weight: 700; padding: 22px 42px; border-radius: 22px; border: 4px solid transparent; background: #2a2464; color: #f4f1ff; cursor: pointer; }
  button.primary { background: #ffd23f; color: #1b1530; }
  button:focus, input:focus { outline: none; border-color: #ff5fa8; box-shadow: 0 0 0 6px rgba(255, 95, 168, .35); }
  input { font: inherit; font-size: 38px; width: 720px; padding: 20px 26px; border-radius: 20px; border: 4px solid #3b3480; background: #120e33; color: #fff; }
  .msg { font-size: 30px; min-height: 44px; color: #b9b2e6; margin-top: 18px; }
  .msg.err { color: #ff8a8a; }
  .found button { font-size: 30px; margin: 8px; }
  .hint { font-size: 26px; color: #8f88c4; margin-top: 40px; line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap"><div class="panel">
  <h1>Acro<span>Party</span></h1>
  <p class="sub">The TV screen for Acro Party. Players join with their phones.</p>

  <div class="row" id="lastRow"><button class="primary" id="lastBtn"></button></div>
  <div class="row"><button id="findBtn">🔎 Find my game</button><button id="onlineBtn">🌐 Play online</button></div>
  <div class="row"><input id="addr" placeholder="Game address, e.g. 192.168.1.23:3000" autocomplete="off"><button id="goBtn">Go</button></div>
  <div class="found" id="found"></div>
  <div class="msg" id="msg"></div>
  <div class="hint">
    Start Acro Party on a computer on the same Wi-Fi first: its window shows the address (for example 192.168.1.23:3000).<br>
    Or choose Play online to use your online version.
  </div>
</div></div>

<script>
  var ONLINE_URL = ''; // Optional: your online address (for example https://acro-party.onrender.com). Leave empty to type it once.
  var KEY = 'acro-tv-last';
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); };
  var store = {
    get: function () { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } },
    set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
  };

  function normalize(a) {
    a = String(a || '').trim().replace(/\/+$/, '').replace(/\/(host|play)$/, '');
    if (!a) return '';
    if (!/^https?:\/\//i.test(a)) a = 'http://' + a;
    if (/^http:\/\/[\d.]+$/i.test(a)) a += ':3000'; // plain IP: add the default port
    return a;
  }

  // Ask an address whether Acro Party is running there.
  function probe(base, timeout) {
    return new Promise(function (resolve) {
      var done = false;
      var x = new XMLHttpRequest();
      var t = setTimeout(function () { if (!done) { done = true; try { x.abort(); } catch (e) {} resolve(false); } }, timeout || 2500);
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || done) return;
        done = true; clearTimeout(t);
        try { resolve(x.status === 200 && JSON.parse(x.responseText).lanUrl ? true : false); } catch (e) { resolve(false); }
      };
      try { x.open('GET', base + '/api/info', true); x.send(); } catch (e) { done = true; clearTimeout(t); resolve(false); }
    });
  }

  function launch(base) {
    store.set(base);
    msg('Opening ' + base.replace(/^https?:\/\//, '') + ' …');
    // TV mode (lite=1) keeps animations smooth on the TV's chip; tvapp=1 tells the game it runs in this app.
    location.href = base + '/host?lite=1&tvapp=1';
  }

  function tryAddress(a) {
    var base = normalize(a);
    if (!base) { msg('Type the address shown on the computer, for example 192.168.1.23:3000', true); return; }
    msg('Checking ' + base.replace(/^https?:\/\//, '') + ' …');
    probe(base, base.indexOf('https://') === 0 ? 60000 : 4000).then(function (ok) {
      if (ok) launch(base);
      else msg("Couldn't reach Acro Party at " + base.replace(/^https?:\/\//, '') + '. Is it running, and is the TV on the same Wi-Fi?', true);
    });
  }

  // Look for the game on common home-network ranges (port 3000 to 3002).
  function findGame() {
    var nets = ['192.168.1', '192.168.0', '10.0.0', '192.168.86', '192.168.68', '192.168.50', '192.168.2', '10.0.1', '192.168.4', '172.16.0'];
    var last = store.get();
    var m = /^http:\/\/(\d+\.\d+\.\d+)\.\d+/.exec(last);
    if (m) nets.unshift(m[1]);
    var targets = [];
    nets.forEach(function (n) { for (var h = 2; h < 255; h++) targets.push('http://' + n + '.' + h + ':3000'); });
    var found = [], i = 0, active = 0, finished = false;
    $('found').innerHTML = '';
    msg('Looking for Acro Party on your network… (this can take up to a minute)');
    return new Promise(function (resolve) {
      function next() {
        if (finished) return;
        if (i >= targets.length && active === 0) { finished = true; resolve(found); return; }
        while (active < 48 && i < targets.length) {
          (function (t) {
            active++;
            probe(t, 1200).then(function (ok) {
              active--;
              if (ok && found.indexOf(t) < 0) {
                found.push(t);
                var b = document.createElement('button');
                b.textContent = '▶ ' + t.replace('http://', '');
                b.onclick = function () { launch(t); };
                $('found').appendChild(b);
                if (found.length === 1) { b.focus(); msg('Found it! Press OK to start.'); }
              }
              next();
            });
          })(targets[i++]);
        }
      }
      next();
    }).then(function (list) {
      if (!list.length) msg("Couldn't find it automatically. Type the address shown on the computer.", true);
    });
  }

  var last = store.get();
  if (last) {
    $('lastBtn').textContent = '▶ Continue: ' + last.replace(/^https?:\/\//, '');
    $('lastBtn').onclick = function () { tryAddress(last); };
    $('addr').value = last.replace(/^https?:\/\//, '');
  } else {
    $('lastRow').className = 'row hidden';
  }
  $('findBtn').onclick = findGame;
  $('goBtn').onclick = function () { tryAddress($('addr').value); };
  $('addr').onkeydown = function (e) { if (e.keyCode === 13) tryAddress($('addr').value); };
  $('onlineBtn').onclick = function () {
    if (ONLINE_URL) return tryAddress(ONLINE_URL);
    var v = $('addr').value;
    if (/^https:\/\//i.test(v) || /onrender\.com/i.test(v)) return tryAddress(/^https?:/i.test(v) ? v : 'https://' + v);
    msg('Type your online address in the box (for example acro-party.onrender.com), then press Play online again.');
    $('addr').value = '';
    $('addr').focus();
  };
  setTimeout(function () { (last ? $('lastBtn') : $('findBtn')).focus(); }, 100);
</script>
</body>
</html>
