<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acro Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 18px; text-align: center; }
  h1 { font-size: 56px; margin: 0; letter-spacing: -1px; }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); font-size: 19px; margin: 0 0 12px; }
  .choice { display: grid; gap: 6px; text-decoration: none; color: inherit; text-align: left; padding: 22px; }
  .choice b { font-size: 24px; }
  .choice:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Acro<span>Party</span></h1>
  <p class="lead">Make up a phrase for the letters. Vote for the funniest. Win the lightning round.</p>
  <a class="card choice" href="/play"><b>📱 Join a game</b><span class="muted">On your phone, with the room code on the TV.</span></a>
  <a class="card choice" href="/host"><b>📺 Host a game</b><span class="muted">Open this on a TV or laptop everyone can see.</span></a>
</main>
</body>
</html>
